name: Frontend build

on:
  pull_request:
    branches: [frontend]
  push:
    branches: [flairplace-saas-phase1, flairplace-pos-phase3, flairplace-inventory-phase4, flairplace-procurement-phase5, flairplace-stock-control-phase6]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: VITE_API_URL=https://api.flairplace.com npm run build
