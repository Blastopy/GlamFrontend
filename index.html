<!DOCTYPE html>
<html lang="en-KE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO (per-page values are updated by src/utils/seo.js) -->
    <title>Flairplace | Book barbers, salons &amp; nail specialists in Kenya</title>
    <meta name="description" content="Find and book trusted barbers, salons and nail specialists near you in Kenya. Browse real work, compare upfront prices and book in minutes on Flairplace." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://flairplace.com/" />
    <meta name="theme-color" content="#e35513" />
    <meta name="application-name" content="Flairplace" />
    <meta name="geo.region" content="KE" />

    <!-- Open Graph (WhatsApp, Facebook, LinkedIn previews) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Flairplace" />
    <meta property="og:locale" content="en_KE" />
    <meta property="og:title" content="Flairplace | Book barbers, salons &amp; nail specialists in Kenya" />
    <meta property="og:description" content="Find and book trusted barbers, salons and nail specialists near you in Kenya. Browse real work, compare upfront prices and book in minutes." />
    <meta property="og:url" content="https://flairplace.com/" />
    <meta property="og:image" content="https://flairplace.com/logo.png" />
    <meta property="og:image:alt" content="Flairplace logo" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@flair_place_ke" />
    <meta name="twitter:title" content="Flairplace | Book barbers, salons &amp; nail specialists in Kenya" />
    <meta name="twitter:description" content="Find and book trusted barbers, salons and nail specialists near you in Kenya. Browse real work, compare upfront prices and book in minutes." />
    <meta name="twitter:image" content="https://flairplace.com/logo.png" />

    <!-- Icons -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Site-wide structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://flairplace.com/#organization",
            "name": "Flairplace",
            "url": "https://flairplace.com/",
            "logo": "https://flairplace.com/logo.png",
            "email": "info@flairplace.com",
            "areaServed": { "@type": "Country", "name": "Kenya" },
            "sameAs": [
              "https://www.facebook.com/profile.php?id=61596585238402",
              "https://www.instagram.com/flairplace.254/",
              "https://www.tiktok.com/@flairplace",
              "https://x.com/flair_place_ke"
            ]
          },
          {
            "@type": "WebSite",
            "@id": "https://flairplace.com/#website",
            "name": "Flairplace",
            "url": "https://flairplace.com/",
            "inLanguage": "en-KE",
            "publisher": { "@id": "https://flairplace.com/#organization" },
            "potentialAction": {
              "@type": "SearchAction",
              "target": "https://flairplace.com/providers?q={search_term_string}",
              "query-input": "required name=search_term_string"
            }
          }
        ]
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <h1>Flairplace: book barbers, salons and nail specialists in Kenya</h1>
      <p>Flairplace helps you find trusted beauty professionals near you, compare prices and book appointments. Please enable JavaScript to use the site.</p>
    </noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
